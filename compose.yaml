services:
  myebooks:
    build: .
    ports:
      - "8000:8000"
    environment:
      EBOOK_SOURCE: ${EBOOK_SOURCE:-fake}
      EBOOK_LOCAL_DIR: ${EBOOK_LOCAL_DIR:-}
      GOOGLE_DRIVE_PUBLIC_URL: ${GOOGLE_DRIVE_PUBLIC_URL:-}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_DRIVE_ID: ${GOOGLE_DRIVE_ID:-}
    volumes:
      - myebooks-data:/app/data
      # Décommentez et adaptez pour le mode Google :
      # - ./service-account.json:/run/secrets/google.json:ro

volumes:
  myebooks-data:
