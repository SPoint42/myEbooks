[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "myebooks"
version = "0.4.0"
description = "A small, self-hosted web library for PDF and EPUB files stored on Google Drive."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SPoint42" }]
dependencies = [
  "EbookLib>=0.19",
  "fastapi>=0.115",
  "gdown>=6.0,<7",
  "google-api-python-client>=2.160",
  "google-auth>=2.38",
  "httpx>=0.28",
  "jinja2>=3.1",
  "pymupdf>=1.25",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
myebooks = "myebooks.main:run"
myebooks-catalog = "myebooks.catalog_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/myebooks"]

[tool.pytest.ini_options]
addopts = "-q --cov=myebooks --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
